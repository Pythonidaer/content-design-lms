<!doctype html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#0b0c0c"><meta name="description" content="A content design course based on GOV.UK guidance with examples, practice, and voice and tone lessons."><title>Content design</title><link rel="stylesheet" href="lms.css"><link rel="stylesheet" href="content-theme.css"><script src="vendor/marked.umd.js" defer></script><script src="lesson-markdown.js" defer></script><script src="lms-runtime.js" defer></script><script src="voice-config.js" defer></script><script src="voice.js" defer></script></head><body class="lms-export-body"><div id="lms-root"></div><script id="lms-course-data" type="application/json">{"schemaVersion": 1, "id": "content-design-course-v1", "title": "Content design", "description": "Learn user-centred content design through GOV.UK guidance, original practice, and context-sensitive voice and tone.", "sections": [{"id": "stage-start", "type": "section", "title": "1 Start", "children": [{"id": "orientation", "type": "slides", "title": "How to use this course", "slides": [{"id": "orientation-1", "title": "How to use this course", "body": "Learn content design: deciding what people need, what to communicate, and how to make it understandable. The LMS is the delivery medium.\n\nFollow Start, then Explore, then Tone in practice. All lessons are available immediately."}, {"id": "orientation-2", "title": "Example", "body": "A person needs to renew a membership. Useful content explains eligibility, price, required information, and the next action. A description of the organisation may not help them renew."}, {"id": "orientation-3", "title": "Try it", "body": "Choose one real page. Write the task its reader should be able to complete. Keep that page as your practice project."}, {"id": "orientation-4", "title": "Review your answer", "body": "A useful task names an outcome: “Renew my membership before it expires.” “Read our membership page” describes your delivery format, not the person’s goal. Lessons use fictional examples; exercises are self-assessed."}, {"id": "orientation-5", "title": "Read further", "body": "[Understand content design](https://guidance.publishing.service.gov.uk/writing-to-gov-uk-standards/plan-manage-content/understand-content-design/)\n\n[Writing to GOV.UK standards](https://guidance.publishing.service.gov.uk/writing-to-gov-uk-standards/)\n\nThese links open in a new tab. Lessons are original summaries and examples; consult the guidance for detail."}]}, {"id": "needs", "type": "slides", "title": "Begin with a user need", "slides": [{"id": "needs-1", "title": "Begin with a user need", "body": "Identify who needs something, what they need to do, and why. Use research, enquiries, and observed behaviour. A stakeholder’s wish for a page is evidence to investigate, not proof of a user need."}, {"id": "needs-2", "title": "Example", "body": "“As a new member, I need to know whether equipment is included, so I can arrive prepared.” This can lead to a short preparation list rather than another marketing page."}, {"id": "needs-3", "title": "Try it", "body": "Rewrite “We need a page promoting our premium plan” as a user need. What evidence would support it?"}, {"id": "needs-4", "title": "Review your answer", "body": "One possibility: “As a buyer, I need to compare plan limits so I can choose an affordable option.” Check support questions or observe people comparing plans. Treat an untested need as a hypothesis."}, {"id": "needs-5", "title": "Read further", "body": "[Identify user needs](https://guidance.publishing.service.gov.uk/writing-to-gov-uk-standards/plan-manage-content/identify-user-needs/)\n\nThese links open in a new tab. Lessons are original summaries and examples; consult the guidance for detail."}]}, {"id": "scope", "type": "slides", "title": "Choose content and format", "slides": [{"id": "scope-1", "title": "Choose content and format", "body": "Check existing content before creating more. Decide what to include, remove, combine, or deliver elsewhere. Choose text, a form, a list, or another format based on the task. More content can create more work for readers."}, {"id": "scope-2", "title": "Example", "body": "A support page has a long essay about appointment booking. The task may need a booking form, preparation checklist, and short cancellation instructions instead."}, {"id": "scope-3", "title": "Try it", "body": "For your practice page, identify one essential item, one distracting item, and a better format for a difficult explanation."}, {"id": "scope-4", "title": "Review your answer", "body": "Keep information needed for decisions and actions. Remove or relocate organisational detail that does not support them. Test a changed format with users; do not assume a diagram or video is always clearer."}, {"id": "scope-5", "title": "Read further", "body": "[Understand content design](https://guidance.publishing.service.gov.uk/writing-to-gov-uk-standards/plan-manage-content/understand-content-design/)\n\n[Plan new GOV.UK content](https://guidance.publishing.service.gov.uk/writing-to-gov-uk-standards/plan-manage-content/plan-new-govuk-content/)\n\nThese links open in a new tab. Lessons are original summaries and examples; consult the guidance for detail."}]}, {"id": "content-workflow", "type": "slides", "title": "Draft and prototype together", "slides": [{"id": "content-workflow-1", "title": "Draft and prototype together", "body": "Content can begin in a document or spreadsheet. Put real wording into a prototype early, then revise wording and layout together. Content design includes selection, order, format, and maintenance as well as the final copy."}, {"id": "content-workflow-2", "title": "Example", "body": "A form draft lists the field label, hint, validation rule, error, and confirmation. In a prototype, a long hint may need to become a separate explanation before the form."}, {"id": "content-workflow-3", "title": "Try it", "body": "Write a label, hint, and error for an email field. Check each in the space where it will appear."}, {"id": "content-workflow-4", "title": "Review your answer", "body": "Example: label “Email address”; hint “We’ll send your receipt here”; error “Enter an email address in the format name@example.com.” This is an authored example, not a universal form rule."}, {"id": "content-workflow-5", "title": "Read further", "body": "[Writing to GOV.UK standards](https://guidance.publishing.service.gov.uk/writing-to-gov-uk-standards/)\n\n[Write content to meet user needs](https://guidance.publishing.service.gov.uk/writing-to-gov-uk-standards/writing-guidelines/meet-user-needs/)\n\nThese links open in a new tab. Lessons are original summaries and examples; consult the guidance for detail."}]}, {"id": "start-check", "type": "quiz", "title": "Start: knowledge check", "skill": "User needs", "questions": [{"id": "start-check-q1", "prompt": "Which is a user outcome?", "options": ["Read our page", "Find out whether I qualify", "Publish a new section"], "answer": 1, "explanation": "Qualification supports a decision; reading and publishing describe activities."}, {"id": "start-check-q2", "prompt": "What should guide a content format?", "options": ["The user’s task and context", "Always using slides", "The longest available document"], "answer": 0, "explanation": "Choose a format that helps the person achieve their goal."}, {"id": "start-check-q3", "prompt": "When should real content enter a prototype?", "options": ["Only after launch", "Early, with content and layout revised together", "Never"], "answer": 1, "explanation": "Words and layout affect each other."}]}]}, {"id": "stage-explore", "type": "section", "title": "2 Explore", "children": [{"id": "planning", "type": "slides", "title": "Plan and organise", "slides": [{"id": "planning-1", "title": "Plan and organise", "body": "Plan where content belongs and how people will find it. Coordinate with existing pages and owners. Group related material using meaningful topics or steps. Navigation is one expression of that organisation, not the whole content plan."}, {"id": "planning-2", "title": "Example", "body": "A service has preparation, application, and follow-up tasks. A step-by-step route can connect them; unrelated policies need not interrupt the main journey."}, {"id": "planning-3", "title": "Try it", "body": "Group your practice page’s information by task. Give each group a descriptive label."}, {"id": "planning-4", "title": "Review your answer", "body": "Use labels readers recognise, then check whether they can find a specific answer. GOV.UK’s publishing structures are context-specific; adapt the principle rather than copying every government content type."}, {"id": "planning-5", "title": "Read further", "body": "[Plan new GOV.UK content](https://guidance.publishing.service.gov.uk/writing-to-gov-uk-standards/plan-manage-content/plan-new-govuk-content/)\n\n[Organise and group GOV.UK content](https://guidance.publishing.service.gov.uk/writing-to-gov-uk-standards/plan-manage-content/organise-group-govuk-content/)\n\nThese links open in a new tab. Lessons are original summaries and examples; consult the guidance for detail."}]}, {"id": "structure", "type": "slides", "title": "Structure for scanning", "slides": [{"id": "structure-1", "title": "Structure for scanning", "body": "Put the most useful information first. Break content into short sections with meaningful headings. Use bullets for parallel items and numbered steps for ordered actions. Avoid repeating a summary in the opening paragraph."}, {"id": "structure-2", "title": "Example", "body": "Before: “Introduction”, followed by organisational history. After: “Renew your membership”, followed by cost, eligibility, and the renewal action."}, {"id": "structure-3", "title": "Try it", "body": "Reorder an existing page so the reader sees the answer or next action before supporting detail."}, {"id": "structure-4", "title": "Review your answer", "body": "A reader should understand the route from headings alone. Keep necessary context and exceptions near the relevant action; do not bury them simply to make a page shorter."}, {"id": "structure-5", "title": "Read further", "body": "[Create a clear structure](https://guidance.publishing.service.gov.uk/writing-to-gov-uk-standards/writing-guidelines/clear-structure/)\n\nThese links open in a new tab. Lessons are original summaries and examples; consult the guidance for detail."}]}, {"id": "language", "type": "slides", "title": "Write in plain language", "slides": [{"id": "language-1", "title": "Write in plain language", "body": "Choose familiar words and concrete actions. Explain specialist terms when needed. Active voice usually makes the actor and action clearer. Plain language helps specialists too; it does not require removing accurate technical meaning."}, {"id": "language-2", "title": "Example", "body": "Before: “Completion of the verification process is required prior to commencement.” After: “Verify your email before you start.”"}, {"id": "language-3", "title": "Try it", "body": "Rewrite one long sentence from your page. Name the actor, use a direct verb, and remove words that add no meaning."}, {"id": "language-4", "title": "Review your answer", "body": "Check that the shorter version preserves the original condition. “You may apply” and “You must apply” are different; concise wording must remain accurate."}, {"id": "language-5", "title": "Read further", "body": "[Use clear language](https://guidance.publishing.service.gov.uk/writing-to-gov-uk-standards/writing-guidelines/clear-language/)\n\nThese links open in a new tab. Lessons are original summaries and examples; consult the guidance for detail."}]}, {"id": "titles", "type": "slides", "title": "Write titles people recognise", "slides": [{"id": "titles-1", "title": "Write titles people recognise", "body": "A title should identify the subject or task with words readers search for. Make it specific enough to distinguish the page from similar pages. Put useful identifying words early."}, {"id": "titles-2", "title": "Example", "body": "“Everything you need to know” reveals little. “Renew a library membership” tells a reader the task and the object."}, {"id": "titles-3", "title": "Try it", "body": "Write two possible titles. Ask someone which page they would select to complete your intended task."}, {"id": "titles-4", "title": "Review your answer", "body": "Prefer the title that predicts the content accurately. Search terms are evidence to consider, not a reason to repeat keywords unnaturally."}, {"id": "titles-5", "title": "Read further", "body": "[Write clear titles](https://guidance.publishing.service.gov.uk/writing-to-gov-uk-standards/writing-guidelines/clear-titles/)\n\nThese links open in a new tab. Lessons are original summaries and examples; consult the guidance for detail."}]}, {"id": "summaries", "type": "slides", "title": "Summarise without repeating", "slides": [{"id": "summaries-1", "title": "Summarise without repeating", "body": "Use a short summary to explain what a page helps someone do or understand. Add useful information beyond the title. Avoid opening the main text by repeating the same sentence."}, {"id": "summaries-2", "title": "Example", "body": "Title: “Renew a membership”. Summary: “Check renewal costs and renew online before your membership expires.”"}, {"id": "summaries-3", "title": "Try it", "body": "Draft a summary for your practice page. Remove anything already obvious from its title."}, {"id": "summaries-4", "title": "Review your answer", "body": "The summary should help a person decide whether this is the right page. Include material limits or audience details when they change that decision."}, {"id": "summaries-5", "title": "Read further", "body": "[Write clear summaries](https://guidance.publishing.service.gov.uk/writing-to-gov-uk-standards/writing-guidelines/summaries/)\n\nThese links open in a new tab. Lessons are original summaries and examples; consult the guidance for detail."}]}, {"id": "links", "type": "slides", "title": "Write useful link text", "slides": [{"id": "links-1", "title": "Write useful link text", "body": "A link should explain its destination or action without relying on surrounding text. Place links where they support a task. Avoid vague labels and competing routes that distract from the main action."}, {"id": "links-2", "title": "Example", "body": "“Read more” is ambiguous. “Check membership eligibility” predicts the destination. For a download, identify its format when that matters."}, {"id": "links-3", "title": "Try it", "body": "Replace three vague links with descriptive labels. Read each label in isolation."}, {"id": "links-4", "title": "Review your answer", "body": "A reader should be able to predict the destination. Do not imply a link submits information if it only opens another page."}, {"id": "links-5", "title": "Read further", "body": "[Write effective links](https://guidance.publishing.service.gov.uk/writing-to-gov-uk-standards/writing-guidelines/add-links/)\n\nThese links open in a new tab. Lessons are original summaries and examples; consult the guidance for detail."}]}, {"id": "accessibility", "type": "slides", "title": "Design accessible content", "slides": [{"id": "accessibility-1", "title": "Design accessible content", "body": "Accessibility affects language, structure, formats, and alternatives. Use meaningful headings and descriptive links. Give useful text alternatives for informative images. Do not make meaning depend only on colour, position, or sound."}, {"id": "accessibility-2", "title": "Example", "body": "A chart’s green line means “approved”, but the caption also names the status and key finding. An audio explanation includes a transcript."}, {"id": "accessibility-3", "title": "Try it", "body": "Find one visual or audio-only explanation on your page. Write an equivalent text explanation."}, {"id": "accessibility-4", "title": "Review your answer", "body": "Describe the information needed for the task, not every decorative detail. Check the result with relevant accessibility guidance and users; an automated score alone does not establish usability."}, {"id": "accessibility-5", "title": "Read further", "body": "[Understand accessibility](https://guidance.publishing.service.gov.uk/writing-to-gov-uk-standards/plan-manage-content/understand-accessibility/)\n\nThese links open in a new tab. Lessons are original summaries and examples; consult the guidance for detail."}]}, {"id": "translations", "type": "slides", "title": "Plan for translation", "slides": [{"id": "translations-1", "title": "Plan for translation", "body": "Consider language needs using evidence about the audience and task. Decide what needs translating and how translated versions stay current. Clear source content and stable terminology make translation easier."}, {"id": "translations-2", "title": "Example", "body": "A translated eligibility guide still shows last year’s threshold. The language is correct, but the information can lead to the wrong decision."}, {"id": "translations-3", "title": "Try it", "body": "Identify who owns updates to each language version of your practice content."}, {"id": "translations-4", "title": "Review your answer", "body": "Record review responsibility and the trigger for updating every version. Machine translation alone is not a quality or accuracy check."}, {"id": "translations-5", "title": "Read further", "body": "[Consider translations](https://guidance.publishing.service.gov.uk/writing-to-gov-uk-standards/plan-manage-content/consider-translations/)\n\nThese links open in a new tab. Lessons are original summaries and examples; consult the guidance for detail."}]}, {"id": "urls", "type": "slides", "title": "Use understandable URLs", "slides": [{"id": "urls-1", "title": "Use understandable URLs", "body": "A URL should be stable, descriptive, and consistent with the site’s standards. Avoid unnecessary words and avoid changing addresses without considering existing links. GOV.UK’s exact URL rules apply to its publishing system."}, {"id": "urls-2", "title": "Example", "body": "A durable address describes the task, such as /membership/renew. An address tied to a temporary campaign may become misleading."}, {"id": "urls-3", "title": "Try it", "body": "Suggest a stable path for your page. What would happen to existing links if you changed it?"}, {"id": "urls-4", "title": "Review your answer", "body": "Plan redirects and ownership when moving published content. A readable URL supports orientation; it does not replace a clear page title."}, {"id": "urls-5", "title": "Read further", "body": "[Follow URL standards](https://guidance.publishing.service.gov.uk/writing-to-gov-uk-standards/plan-manage-content/follow-url-standards/)\n\nThese links open in a new tab. Lessons are original summaries and examples; consult the guidance for detail."}]}, {"id": "maintenance", "type": "slides", "title": "Maintain existing content", "slides": [{"id": "maintenance-1", "title": "Maintain existing content", "body": "Content needs an accountable owner and a review plan. Audit what exists, identify duplication and outdated information, and use evidence to decide what to improve. Publication is the start of maintenance."}, {"id": "maintenance-2", "title": "Example", "body": "Two pages list different renewal prices. Fixing one sentence is not enough if another owner continues updating the duplicate page."}, {"id": "maintenance-3", "title": "Try it", "body": "Record the owner, review trigger, and source of truth for your practice page."}, {"id": "maintenance-4", "title": "Review your answer", "body": "Review when policy or service details change, not only on a calendar date. Where duplication causes conflict, coordinate consolidation and links."}, {"id": "maintenance-5", "title": "Read further", "body": "[Manage existing GOV.UK content](https://guidance.publishing.service.gov.uk/writing-to-gov-uk-standards/plan-manage-content/manage-existing-govuk-content/)\n\nThese links open in a new tab. Lessons are original summaries and examples; consult the guidance for detail."}]}, {"id": "retirement", "type": "slides", "title": "Retire outdated material", "slides": [{"id": "retirement-1", "title": "Retire outdated material", "body": "Decide whether old information should remain as a record, be withdrawn, or be removed. Explain what replaces it when readers still arrive. GOV.UK distinguishes retirement options within its publishing workflow."}, {"id": "retirement-2", "title": "Example", "body": "A closed application page remains discoverable. A clear closure notice and link to the current programme can prevent wasted effort."}, {"id": "retirement-3", "title": "Try it", "body": "Choose one obsolete page. Explain what a visitor should see and where they should go instead."}, {"id": "retirement-4", "title": "Review your answer", "body": "Consider historical value, continuing user needs, redirects, and organisational requirements. Do not delete content solely because it is old."}, {"id": "retirement-5", "title": "Read further", "body": "[Retire outdated content](https://guidance.publishing.service.gov.uk/writing-to-gov-uk-standards/plan-manage-content/retire-content/)\n\nThese links open in a new tab. Lessons are original summaries and examples; consult the guidance for detail."}]}, {"id": "changes", "type": "slides", "title": "Explain changes before they happen", "slides": [{"id": "changes-1", "title": "Explain changes before they happen", "body": "Help readers understand what is changing, who is affected, when it happens, and what they need to do. Explain the practical consequence rather than only announcing an internal policy name."}, {"id": "changes-2", "title": "Example", "body": "“Our process is changing” gives no action. “From 1 June, renew online. Bring your current membership number” gives a date and a next step."}, {"id": "changes-3", "title": "Try it", "body": "Draft a short notice with a date, affected audience, and required action."}, {"id": "changes-4", "title": "Review your answer", "body": "Check whether someone can act before the change. Link to the current process and explain any transitional arrangement when needed."}, {"id": "changes-5", "title": "Read further", "body": "[Help users prepare for change](https://guidance.publishing.service.gov.uk/writing-to-gov-uk-standards/help-users-prepare-change/)\n\nThese links open in a new tab. Lessons are original summaries and examples; consult the guidance for detail."}]}, {"id": "change-notes", "type": "slides", "title": "Write useful change notes", "slides": [{"id": "change-notes-1", "title": "Write useful change notes", "body": "When an update needs a change note, describe the substantive difference and its effect on users. Follow the publisher’s rules about which changes need notes. Avoid an unexplained “updated”."}, {"id": "change-notes-2", "title": "Example", "body": "“Updated guidance” hides the change. “Added the new renewal fee for applications received from 1 June” explains what changed."}, {"id": "change-notes-3", "title": "Try it", "body": "Write a change note for a revised eligibility threshold."}, {"id": "change-notes-4", "title": "Review your answer", "body": "Name the changed rule and relevant date. Minor spelling fixes may not need a public note; check the publishing policy."}, {"id": "change-notes-5", "title": "Read further", "body": "[Write change notes](https://guidance.publishing.service.gov.uk/writing-to-gov-uk-standards/writing-guidelines/change-notes/)\n\nThese links open in a new tab. Lessons are original summaries and examples; consult the guidance for detail."}]}, {"id": "style-guides", "type": "slides", "title": "Use style guides as references", "slides": [{"id": "style-guides-1", "title": "Use style guides as references", "body": "Style guides provide consistent conventions for words, numbers, punctuation, and technical terms. Consult entries as needed rather than memorising an entire alphabetical list. Separate a publisher’s house style from a universal requirement."}, {"id": "style-guides-2", "title": "Example", "body": "A team decides how to format dates, refer to products, and introduce abbreviations. A shared reference avoids inconsistent choices across pages."}, {"id": "style-guides-3", "title": "Try it", "body": "Look up one uncertain term in the A to Z guide and one in the technical guide. Record the decision and its context."}, {"id": "style-guides-4", "title": "Review your answer", "body": "The complete guides are linked as reference material, not reproduced or exhaustively taught. Apply a house-style rule deliberately; retain accurate names and technical meaning."}, {"id": "style-guides-5", "title": "Read further", "body": "[How to use the style guide](https://guidance.publishing.service.gov.uk/writing-to-gov-uk-standards/style-guides/how-to-use/)\n\n[A to Z style guide](https://guidance.publishing.service.gov.uk/writing-to-gov-uk-standards/style-guides/a-to-z-style-guide/)\n\n[Technical A to Z style guide](https://guidance.publishing.service.gov.uk/writing-to-gov-uk-standards/style-guides/technical-a-to-z/)\n\nThese links open in a new tab. Lessons are original summaries and examples; consult the guidance for detail."}]}, {"id": "evaluate", "type": "slides", "title": "Evaluate and improve", "slides": [{"id": "evaluate-1", "title": "Evaluate and improve", "body": "Combine research with evidence such as support enquiries, search behaviour, and task performance. Analytics can reveal a problem but rarely explain it alone. Test whether people understand the content and can act."}, {"id": "evaluate-2", "title": "Example", "body": "Many visits to a help page could mean useful guidance or repeated confusion. Observing the task helps distinguish them."}, {"id": "evaluate-3", "title": "Try it", "body": "Ask a person to use your page to make a decision. Observe hesitation before explaining anything."}, {"id": "evaluate-4", "title": "Review your answer", "body": "Record what they misunderstood, revise the relevant content, and test again. Avoid treating reading time, clicks, or a readability score as proof of understanding."}, {"id": "evaluate-5", "title": "Read further", "body": "[Find tools and resources for analysing content](https://guidance.publishing.service.gov.uk/writing-to-gov-uk-standards/find-tools-resources/)\n\n[Identify user needs](https://guidance.publishing.service.gov.uk/writing-to-gov-uk-standards/plan-manage-content/identify-user-needs/)\n\nThese links open in a new tab. Lessons are original summaries and examples; consult the guidance for detail."}]}, {"id": "explore-check", "type": "quiz", "title": "Explore: knowledge check", "skill": "Content practice", "questions": [{"id": "explore-check-q1", "prompt": "What belongs near the start of task guidance?", "options": ["The most useful answer or action", "Organisational history by default", "A repeated summary"], "answer": 0, "explanation": "Prioritise the reader’s task."}, {"id": "explore-check-q2", "prompt": "Which link label best predicts a destination?", "options": ["Here", "More", "Check renewal costs"], "answer": 2, "explanation": "The label identifies the information the link opens."}, {"id": "explore-check-q3", "prompt": "What supports ongoing content accuracy?", "options": ["Publication alone", "An owner and review triggers", "A decorative updated badge"], "answer": 1, "explanation": "Ownership and review support reliable maintenance."}, {"id": "explore-check-q4", "prompt": "A page has high traffic. What follows?", "options": ["It must be clear", "Investigate task success and user behaviour", "Remove it immediately"], "answer": 1, "explanation": "Traffic alone does not explain whether a need is met."}, {"id": "explore-check-q5", "prompt": "How should a house-style rule be treated?", "options": ["As an intentional publishing convention", "As a law for every website", "As more important than accurate meaning"], "answer": 0, "explanation": "Understand its scope before adopting it."}]}]}, {"id": "stage-tone", "type": "section", "title": "3 Tone in practice", "children": [{"id": "voice-tone", "type": "slides", "title": "Separate voice from tone", "slides": [{"id": "voice-tone-1", "title": "Separate voice from tone", "body": "Voice is a relatively consistent identity. Tone changes with the situation and the reader’s likely state. A friendly organisation can sound calm during a failure and more celebratory after an achievement."}, {"id": "voice-tone-2", "title": "Example", "body": "A service may normally sound conversational. When payment fails, it should explain the problem and recovery action without joking about the user’s money."}, {"id": "voice-tone-3", "title": "Try it", "body": "Write one confirmation and one failure message for the same service. Preserve its identity while changing emotional intensity."}, {"id": "voice-tone-4", "title": "Review your answer", "body": "Check what readers need at that moment. A friendly failure message still needs a cause, next step, and accurate account of what happened."}, {"id": "voice-tone-5", "title": "Read further", "body": "[Mailchimp: Voice and Tone](https://styleguide.mailchimp.com/voice-and-tone/)\n\nThese links open in a new tab. Lessons are original summaries and examples; consult the guidance for detail."}]}, {"id": "tone-dimensions", "type": "slides", "title": "Compare tone along four dimensions", "slides": [{"id": "tone-dimensions-1", "title": "Compare tone along four dimensions", "body": "NN/g offers four spectrums: formal/casual, serious/funny, respectful/irreverent, and matter-of-fact/enthusiastic. These qualities can combine. A position on a spectrum is a design choice, not a universal ranking."}, {"id": "tone-dimensions-2", "title": "Example", "body": "Authored comparison: “Your draft was saved.” is matter-of-fact. “Your draft is saved. You’re ready to continue.” adds encouragement without changing the saved state."}, {"id": "tone-dimensions-3", "title": "Try it", "body": "Choose a message. Describe its position on the four dimensions, then change only one dimension."}, {"id": "tone-dimensions-4", "title": "Review your answer", "body": "Keep the underlying information constant so you can judge the tone change. Test whether readers perceive the intended qualities; your intended tone may differ from theirs."}, {"id": "tone-dimensions-5", "title": "Read further", "body": "[NN/g: Four Dimensions of Tone of Voice](https://www.nngroup.com/articles/tone-of-voice-dimensions/)\n\nThese links open in a new tab. Lessons are original summaries and examples; consult the guidance for detail."}]}, {"id": "gov-voice", "type": "slides", "title": "Understand GOV.UK’s tone", "slides": [{"id": "gov-voice-1", "title": "Understand GOV.UK’s tone", "body": "GOV.UK aims for useful, direct, restrained communication with human authority. It addresses readers directly and avoids unnecessary ceremony. This is a particular public-service voice; it is not a requirement that every brand sound identical."}, {"id": "gov-voice-2", "title": "Example", "body": "Authored example: “You can renew online until 30 June” gives a clear action and limit. “We are delighted to announce an exciting renewal opportunity” adds enthusiasm without helping the task."}, {"id": "gov-voice-3", "title": "Try it", "body": "Rewrite a promotional introduction as practical service guidance. Keep any eligibility conditions and deadlines."}, {"id": "gov-voice-4", "title": "Review your answer", "body": "Check clarity, precision, respectful wording, and who “we” refers to. Do not confuse brevity with withholding information a reader needs."}, {"id": "gov-voice-5", "title": "Read further", "body": "[Use the right tone](https://guidance.publishing.service.gov.uk/writing-to-gov-uk-standards/writing-guidelines/right-tone/)\n\nThese links open in a new tab. Lessons are original summaries and examples; consult the guidance for detail."}]}, {"id": "tone-testing", "type": "slides", "title": "Compare and test tone", "slides": [{"id": "tone-testing-1", "title": "Compare and test tone", "body": "Compare versions with the same facts and actions. Choose a few target qualities and qualities to avoid. Ask readers how the content sounds and whether they can complete the task."}, {"id": "tone-testing-2", "title": "Example", "body": "Authored targets: authoritative without being condescending; encouraging without exaggerating; playful without blaming the reader. A tone label is a hypothesis about how writing will be perceived."}, {"id": "tone-testing-3", "title": "Try it", "body": "Write two versions of a reminder. Ask someone to describe each and explain what they would do next."}, {"id": "tone-testing-4", "title": "Review your answer", "body": "Use the published NN/g samples as a comparison reference. Our examples here are newly written. Evaluate comprehension and appropriateness as well as preference."}, {"id": "tone-testing-5", "title": "Read further", "body": "[NN/g: Tone-of-Voice Samples](https://www.nngroup.com/articles/tone-voice-samples/)\n\n[NN/g: Tone-of-Voice Words](https://www.nngroup.com/articles/tone-voice-words/)\n\nThese links open in a new tab. Lessons are original summaries and examples; consult the guidance for detail."}]}, {"id": "tone-reference", "type": "slides", "title": "Ten tone qualities", "slides": [{"id": "tone-reference-intro", "title": "A practical tone reference", "body": "The next ten slides are an authored teaching reference, not an official GOV.UK taxonomy or an exhaustive set of tones. Qualities overlap and can combine.\n\nUse context, purpose, audience, and testing to choose. Sources: [NN/g dimensions](https://www.nngroup.com/articles/tone-of-voice-dimensions/) and [Mailchimp voice and tone](https://styleguide.mailchimp.com/voice-and-tone/)."}, {"id": "tone-quality-1", "title": "Reassuring", "body": "Reduce uncertainty using accurate information.\n\n**Example:** Your draft is saved. You can return later.\n\n**Watch for:** Do not promise safety or recovery you cannot verify.\n\n**Try:** A file upload is still processing. Write a reassuring status without claiming it has finished."}, {"id": "tone-quality-2", "title": "Authoritative", "body": "Communicate expertise with precise, supported guidance.\n\n**Example:** Use descriptive labels so readers can identify each link.\n\n**Watch for:** Authority does not require jargon or commands without explanation.\n\n**Try:** Explain why a vague link label needs revision without talking down to its writer."}, {"id": "tone-quality-3", "title": "Instructional", "body": "Help someone perform an action in the right order.\n\n**Example:** Select a chapter, then choose a lesson.\n\n**Watch for:** Avoid vague verbs when a specific action matters.\n\n**Try:** Write the first two steps of a password reset."}, {"id": "tone-quality-4", "title": "Conversational", "body": "Sound natural and approachable while remaining clear.\n\n**Example:** Where would you like to start?\n\n**Watch for:** Casual wording should not hide conditions or consequences.\n\n**Try:** Rewrite a formal welcome as a short conversation opener."}, {"id": "tone-quality-5", "title": "Encouraging", "body": "Support progress with specific, truthful feedback.\n\n**Example:** The structure is correct. Check the value types next.\n\n**Watch for:** Avoid praise that claims mastery without evidence.\n\n**Try:** Give feedback after a partly correct answer."}, {"id": "tone-quality-6", "title": "Empathetic", "body": "Acknowledge the situation and offer useful help.\n\n**Example:** Losing work is frustrating. Here are your recovery options.\n\n**Watch for:** Do not assume everyone feels the same emotion.\n\n**Try:** Write a response to a missed deadline that acknowledges the problem and explains options."}, {"id": "tone-quality-7", "title": "Playful", "body": "Use lightness where the stakes and audience permit it.\n\n**Example:** Pip found the depot. The parcel needs a better label.\n\n**Watch for:** Humour should not blame readers or obscure important failures.\n\n**Try:** Add lightness to an optional practice activity, preserving its instructions."}, {"id": "tone-quality-8", "title": "Urgent", "body": "Communicate a real time-sensitive consequence.\n\n**Example:** Your session expires in two minutes. Save your work.\n\n**Watch for:** Do not invent scarcity or use urgency to pressure a decision.\n\n**Try:** Write a reminder for a genuine approaching deadline."}, {"id": "tone-quality-9", "title": "Neutral", "body": "Present information without added emotional intensity.\n\n**Example:** Three lessons remain.\n\n**Watch for:** Neutral does not mean vague or unhelpful.\n\n**Try:** Rewrite an exaggerated update as a factual status."}, {"id": "tone-quality-10", "title": "Celebratory", "body": "Recognise an actual achievement proportionately.\n\n**Example:** Chapter completed. You identified all six value types.\n\n**Watch for:** Keep the achievement specific and avoid overstating capability.\n\n**Try:** Write a completion message that names what was accomplished."}]}, {"id": "capstone", "type": "slides", "title": "Apply content design end to end", "slides": [{"id": "capstone-1", "title": "Apply content design end to end", "body": "Bring the decisions together: need, evidence, content, structure, format, tone, and maintenance. The aim is a useful outcome for a reader rather than a particular writing style."}, {"id": "capstone-2", "title": "Example", "body": "Fictional brief: a community centre changes its membership renewal process. Members need to know eligibility, costs, deadlines, and what to do if they cannot renew online."}, {"id": "capstone-3", "title": "Try it", "body": "Draft a title, summary, three headings, action label, failure message, and change notice. Explain your tone choices. Assign an owner and review trigger."}, {"id": "capstone-4", "title": "Review your answer", "body": "Self-check: can a member find the right action, understand its conditions, and recover from failure? Are facts verified, alternatives accessible, and ownership clear? Test the draft in its real layout. This exercise is self-assessed, not automatically graded."}, {"id": "capstone-5", "title": "Read further", "body": "[Understand content design](https://guidance.publishing.service.gov.uk/writing-to-gov-uk-standards/plan-manage-content/understand-content-design/)\n\n[Writing to GOV.UK standards](https://guidance.publishing.service.gov.uk/writing-to-gov-uk-standards/)\n\nThese links open in a new tab. Lessons are original summaries and examples; consult the guidance for detail."}]}, {"id": "tone-check", "type": "quiz", "title": "Tone: knowledge check", "skill": "Voice and tone", "questions": [{"id": "tone-check-q1", "prompt": "What changes most with a reader’s situation?", "options": ["Tone", "Every factual requirement", "The definition of a link"], "answer": 0, "explanation": "Tone adapts while accuracy and useful information remain essential."}, {"id": "tone-check-q2", "prompt": "Which is a tone dimension in NN/g’s framework?", "options": ["Formal to casual", "Blue to green", "Desktop to mobile"], "answer": 0, "explanation": "Formality is one of the framework’s four dimensions."}, {"id": "tone-check-q3", "prompt": "Which message suits an interrupted payment?", "options": ["You broke it!", "Payment failed. No charge was made. Try again.", "Great news, something happened!"], "answer": 1, "explanation": "Clear recovery guidance is useful. In a real service, verify the no-charge statement before using it."}, {"id": "tone-check-q4", "prompt": "How should tone qualities be used?", "options": ["As a fixed universal taxonomy", "As overlapping design targets tested in context", "As a substitute for facts"], "answer": 1, "explanation": "The ten qualities are a practical authored reference, not a universal list."}]}]}, {"id": "stage-sources", "type": "section", "title": "4 Sources", "children": [{"id": "source-directory", "type": "slides", "title": "Source directory and scope", "slides": [{"id": "resource-scope", "title": "What the sources cover", "body": "Start with Understand content design, then explore Writing to GOV.UK standards. This course adapts the core planning and writing topics linked directly from that section.\n\nThe full A to Z and technical style guides remain lookup references. We do not claim to reproduce every GOV.UK publication, publishing-tool instruction, or alphabetical entry."}, {"id": "resource-list-0", "title": "Source directory 1", "body": "[Understand content design](https://guidance.publishing.service.gov.uk/writing-to-gov-uk-standards/plan-manage-content/understand-content-design/)\n\n[Writing to GOV.UK standards](https://guidance.publishing.service.gov.uk/writing-to-gov-uk-standards/)\n\n[Identify user needs](https://guidance.publishing.service.gov.uk/writing-to-gov-uk-standards/plan-manage-content/identify-user-needs/)\n\n[Plan new GOV.UK content](https://guidance.publishing.service.gov.uk/writing-to-gov-uk-standards/plan-manage-content/plan-new-govuk-content/)\n\nOriginal sources. Open in a new tab."}, {"id": "resource-list-4", "title": "Source directory 2", "body": "[Manage existing GOV.UK content](https://guidance.publishing.service.gov.uk/writing-to-gov-uk-standards/plan-manage-content/manage-existing-govuk-content/)\n\n[Understand accessibility](https://guidance.publishing.service.gov.uk/writing-to-gov-uk-standards/plan-manage-content/understand-accessibility/)\n\n[Follow URL standards](https://guidance.publishing.service.gov.uk/writing-to-gov-uk-standards/plan-manage-content/follow-url-standards/)\n\n[Consider translations](https://guidance.publishing.service.gov.uk/writing-to-gov-uk-standards/plan-manage-content/consider-translations/)\n\nOriginal sources. Open in a new tab."}, {"id": "resource-list-8", "title": "Source directory 3", "body": "[Organise and group GOV.UK content](https://guidance.publishing.service.gov.uk/writing-to-gov-uk-standards/plan-manage-content/organise-group-govuk-content/)\n\n[Retire outdated content](https://guidance.publishing.service.gov.uk/writing-to-gov-uk-standards/plan-manage-content/retire-content/)\n\n[Help users prepare for change](https://guidance.publishing.service.gov.uk/writing-to-gov-uk-standards/help-users-prepare-change/)\n\n[Find tools and resources for analysing content](https://guidance.publishing.service.gov.uk/writing-to-gov-uk-standards/find-tools-resources/)\n\nOriginal sources. Open in a new tab."}, {"id": "resource-list-12", "title": "Source directory 4", "body": "[Write content to meet user needs](https://guidance.publishing.service.gov.uk/writing-to-gov-uk-standards/writing-guidelines/meet-user-needs/)\n\n[Create a clear structure](https://guidance.publishing.service.gov.uk/writing-to-gov-uk-standards/writing-guidelines/clear-structure/)\n\n[Use clear language](https://guidance.publishing.service.gov.uk/writing-to-gov-uk-standards/writing-guidelines/clear-language/)\n\n[Use the right tone](https://guidance.publishing.service.gov.uk/writing-to-gov-uk-standards/writing-guidelines/right-tone/)\n\nOriginal sources. Open in a new tab."}, {"id": "resource-list-16", "title": "Source directory 5", "body": "[Write effective links](https://guidance.publishing.service.gov.uk/writing-to-gov-uk-standards/writing-guidelines/add-links/)\n\n[Write clear titles](https://guidance.publishing.service.gov.uk/writing-to-gov-uk-standards/writing-guidelines/clear-titles/)\n\n[Write clear summaries](https://guidance.publishing.service.gov.uk/writing-to-gov-uk-standards/writing-guidelines/summaries/)\n\n[Write change notes](https://guidance.publishing.service.gov.uk/writing-to-gov-uk-standards/writing-guidelines/change-notes/)\n\nOriginal sources. Open in a new tab."}, {"id": "resource-list-20", "title": "Source directory 6", "body": "[How to use the style guide](https://guidance.publishing.service.gov.uk/writing-to-gov-uk-standards/style-guides/how-to-use/)\n\n[A to Z style guide](https://guidance.publishing.service.gov.uk/writing-to-gov-uk-standards/style-guides/a-to-z-style-guide/)\n\n[Technical A to Z style guide](https://guidance.publishing.service.gov.uk/writing-to-gov-uk-standards/style-guides/technical-a-to-z/)\n\n[NN/g: Four Dimensions of Tone of Voice](https://www.nngroup.com/articles/tone-of-voice-dimensions/)\n\nOriginal sources. Open in a new tab."}, {"id": "resource-list-24", "title": "Source directory 7", "body": "[NN/g: Tone-of-Voice Samples](https://www.nngroup.com/articles/tone-voice-samples/)\n\n[NN/g: Tone-of-Voice Words](https://www.nngroup.com/articles/tone-voice-words/)\n\n[Mailchimp: Voice and Tone](https://styleguide.mailchimp.com/voice-and-tone/)\n\nOriginal sources. Open in a new tab."}]}]}], "settings": {"passScore": 80, "allowRetakes": true, "showLessonDetails": false, "unlockAll": true, "sequential": false, "requireLessons": true, "brand": "#1d70b8", "background": "#ffffff", "surface": "#f3f2f1", "text": "#0b0c0c", "muted": "#505a5f", "border": "#b1b4b6", "fontScale": 1, "spacing": 24, "contentWidth": 850, "radius": 2, "font": "system", "headingFont": "system", "lineHeight": 1.6}, "finalQuiz": {"id": "content-design-final", "type": "quiz", "title": "Final review", "skill": "Content design review", "questions": [{"id": "final-start-check-q1", "prompt": "Which is a user outcome?", "options": ["Read our page", "Find out whether I qualify", "Publish a new section"], "answer": 1, "explanation": "Qualification supports a decision; reading and publishing describe activities."}, {"id": "final-start-check-q2", "prompt": "What should guide a content format?", "options": ["The user’s task and context", "Always using slides", "The longest available document"], "answer": 0, "explanation": "Choose a format that helps the person achieve their goal."}, {"id": "final-start-check-q3", "prompt": "When should real content enter a prototype?", "options": ["Only after launch", "Early, with content and layout revised together", "Never"], "answer": 1, "explanation": "Words and layout affect each other."}, {"id": "final-explore-check-q1", "prompt": "What belongs near the start of task guidance?", "options": ["The most useful answer or action", "Organisational history by default", "A repeated summary"], "answer": 0, "explanation": "Prioritise the reader’s task."}, {"id": "final-explore-check-q2", "prompt": "Which link label best predicts a destination?", "options": ["Here", "More", "Check renewal costs"], "answer": 2, "explanation": "The label identifies the information the link opens."}, {"id": "final-explore-check-q3", "prompt": "What supports ongoing content accuracy?", "options": ["Publication alone", "An owner and review triggers", "A decorative updated badge"], "answer": 1, "explanation": "Ownership and review support reliable maintenance."}, {"id": "final-explore-check-q4", "prompt": "A page has high traffic. What follows?", "options": ["It must be clear", "Investigate task success and user behaviour", "Remove it immediately"], "answer": 1, "explanation": "Traffic alone does not explain whether a need is met."}, {"id": "final-explore-check-q5", "prompt": "How should a house-style rule be treated?", "options": ["As an intentional publishing convention", "As a law for every website", "As more important than accurate meaning"], "answer": 0, "explanation": "Understand its scope before adopting it."}, {"id": "final-tone-check-q1", "prompt": "What changes most with a reader’s situation?", "options": ["Tone", "Every factual requirement", "The definition of a link"], "answer": 0, "explanation": "Tone adapts while accuracy and useful information remain essential."}, {"id": "final-tone-check-q2", "prompt": "Which is a tone dimension in NN/g’s framework?", "options": ["Formal to casual", "Blue to green", "Desktop to mobile"], "answer": 0, "explanation": "Formality is one of the framework’s four dimensions."}, {"id": "final-tone-check-q3", "prompt": "Which message suits an interrupted payment?", "options": ["You broke it!", "Payment failed. No charge was made. Try again.", "Great news, something happened!"], "answer": 1, "explanation": "Clear recovery guidance is useful. In a real service, verify the no-charge statement before using it."}, {"id": "final-tone-check-q4", "prompt": "How should tone qualities be used?", "options": ["As a fixed universal taxonomy", "As overlapping design targets tested in context", "As a substitute for facts"], "answer": 1, "explanation": "The ten qualities are a practical authored reference, not a universal list."}]}}</script></body></html>
